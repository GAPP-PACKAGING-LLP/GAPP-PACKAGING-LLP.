<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="100%" height="100%">
  <defs>
    <style>
      .blue-brand { fill: #0084FF; }
      .dark-brand { fill: #1D222E; }
      .teal-tagline { fill: #0A4E4D; }
      .font-main {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
      }
      .font-tag {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Left Interlocking Diamond Symbol -->
  <g transform="translate(85, 90) scale(0.48)">
    <g transform="translate(-75, 0) rotate(45)">
      <path class="blue-brand" fill-rule="evenodd" d="
        M -78 -78
        H 78
        V 78
        H -78
        Z
        M -33 -33
        V 33
        H 33
        V -33
        Z
      " />
    </g>
    <g transform="translate(75, 0) rotate(45)">
      <path class="dark-brand" fill-rule="evenodd" d="
        M -78 -78
        H 78
        V 78
        H -78
        Z
        M -33 -33
        V 33
        H 33
        V -33
        Z
      " />
    </g>
    <g transform="translate(-75, 0) rotate(45)">
      <path class="blue-brand" d="
        M -78 -78
        H 78
        V -33
        H -78
        Z
      " />
    </g>
  </g>

  <!-- Right Typography -->
  <g transform="translate(180, 85)">
    <text class="font-main" font-size="44" letter-spacing="0.5">
      <tspan class="blue-brand">GAPP </tspan>
      <tspan class="dark-brand">PACKAGING</tspan>
    </text>
  </g>

  <g transform="translate(182, 132)">
    <line x1="0" y1="-5" x2="45" y2="-5" stroke="#0A4E4D" stroke-width="3" stroke-linecap="round" />
    <text class="font-tag" fill="#0A4E4D" font-size="24" letter-spacing="0.3" x="55" y="2">
      Focus On Quality
    </text>
    <line x1="285" y1="-5" x2="330" y2="-5" stroke="#0A4E4D" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
