<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FFFFFF" rx="16"/>
  <defs>
    <style>
      .blue-brand { fill: #0084FF; }
      .dark-brand { fill: #1D222E; }
      .font-main {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 900;
      }
      .font-tag {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Interlocking Diamond Symbol -->
  <g id="interlocking-mark">
    <!-- 1. Left Blue Diamond -->
    <g transform="translate(325, 175) rotate(45)">
      <path class="blue-brand" fill-rule="evenodd" d="
        M -78 -78
        H 78
        V 78
        H -78
        Z
        M -33 -33
        V 33
        H 33
        V -33
        Z
      " />
    </g>

    <!-- 2. Right Dark Diamond -->
    <g transform="translate(475, 175) rotate(45)">
      <path class="dark-brand" fill-rule="evenodd" d="
        M -78 -78
        H 78
        V 78
        H -78
        Z
        M -33 -33
        V 33
        H 33
        V -33
        Z
      " />
    </g>

    <!-- 3. Interlocking Weave -->
    <g transform="translate(325, 175) rotate(45)">
      <path class="blue-brand" d="
        M -78 -78
        H 78
        V -33
        H -78
        Z
      " />
    </g>
  </g>

  <!-- Typography Line 1: GAPP PACKAGING -->
  <g transform="translate(400, 395)" text-anchor="middle">
    <text class="font-main" font-size="64" letter-spacing="1">
      <tspan class="blue-brand">GAPP </tspan>
      <tspan class="dark-brand">PACKAGING</tspan>
    </text>
  </g>

  <!-- Typography Line 2: — Focus On Quality — -->
  <g transform="translate(400, 470)">
    <line x1="-340" y1="-8" x2="-210" y2="-8" stroke="#0A4E4D" stroke-width="5" stroke-linecap="round" />
    <text text-anchor="middle" class="font-tag" fill="#0A4E4D" font-size="38" letter-spacing="0.5">
      Focus On Quality
    </text>
    <line x1="210" y1="-8" x2="340" y2="-8" stroke="#0A4E4D" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
